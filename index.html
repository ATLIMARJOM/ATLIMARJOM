<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Site oficial da ATLIMARJOM - Associação dos Trabalhadores de Limpeza e Materiais Recicláveis de João Monlevade. Notícias, serviços de reciclagem, pontos de coleta e impacto socioambiental.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="./public/images/logo.png">
  <title>ATLIMARJOM - Associação dos Catadores de João Monlevade</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Formulário Oculto para Detecção Automática do Netlify Forms no Deploy -->
  <div style="display: none;">
    <form name="contato" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contato" />
      <input type="text" name="bot-field" />
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="text" name="assunto" />
      <textarea name="mensagem"></textarea>
    </form>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>

</html>
